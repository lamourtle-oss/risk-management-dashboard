<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>STL Dashboard</title>
    <link rel="stylesheet" href="css/styles.css?v=7" />
  </head>
  <body>
    <div id="gate" class="gate" style="display:block;position:relative;max-width:420px;margin:12vh auto;">
      <div class="gate-card">
        <p class="eyebrow">Singer Thailand</p>
        <h1>แดชบอร์ดปฏิบัติการ</h1>
        <p class="gate-copy">ข้อมูลจาก SharePoint IT Audit / Risk Management</p>
        <p class="hint">พิมพ์ Risk2026 แล้วกดเข้าสู่ระบบ — ถ้าปุ่มไม่ทำงานให้เปิดหน้าแดชบอร์ดโดยตรง</p>
        <form id="login-form" action="home.html" method="get">
          <label for="password">รหัสผ่าน</label>
          <input id="password" type="password" autocomplete="current-password" />
          <button id="login-btn" type="submit">เข้าสู่ระบบ</button>
          <p id="login-error" class="error" hidden>รหัสผ่านไม่ถูกต้อง</p>
        </form>
        <p class="hint"><a href="home.html">เปิดแดชบอร์ด</a></p>
      </div>
    </div>
    <script src="js/login.js?v=7"></script>
  </body>
</html>
